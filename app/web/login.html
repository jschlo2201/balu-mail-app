<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Balu-Mail – Anmelden</title>
<meta name="theme-color" content="#1a6fe6">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/logos/__LOGO__-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/logos/__LOGO__-192.png">
<link rel="apple-touch-icon" href="/icons/logos/__LOGO__-192.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:15px/1.4 Roboto,"Segoe UI",system-ui,Arial,sans-serif;background:#eef1f5;color:#1f1f1f}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:#fff;border-radius:18px;padding:34px 30px 28px;width:min(380px,100%);box-shadow:0 8px 30px rgba(20,40,80,.08);text-align:center}
  .box img{width:72px;height:72px;margin-bottom:10px}
  h1{margin:0 0 4px;font-size:24px;color:#1a6fe6;font-weight:500} h1 b{font-weight:700}
  p{margin:0 0 22px;color:#666;font-size:14px}
  input[type=password],input[type=text]{width:100%;height:46px;border:1px solid #c9ced6;border-radius:12px;padding:0 14px;font:inherit;outline:none;margin-bottom:12px}
  input:focus{border-color:#1a6fe6}
  #code{letter-spacing:6px;text-align:center;font-size:20px}
  label.keep{display:flex;gap:8px;align-items:center;margin:4px 2px 18px;color:#444;font-size:14px;text-align:left}
  button{width:100%;height:46px;border:0;border-radius:23px;background:#1a6fe6;color:#fff;font:inherit;font-size:16px;cursor:pointer}
  button:hover{background:#155bc0}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#c5221f;font-size:14px;margin-top:14px;min-height:20px}
  .small{font-size:12px;color:#888;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <form class="box" id="f" autocomplete="on">
    <img src="/icons/logos/__LOGO__.svg" alt="">
    <h1>Balu<b>-Mail</b></h1>
    <p>Bitte melden Sie sich an.</p>
    <input type="text" name="username" value="balu" autocomplete="username" hidden>
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus required>
    <input type="text" id="code" placeholder="Code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required>
    <label class="keep"><input type="checkbox" id="keep"> Auf diesem Gerät 30 Tage angemeldet bleiben</label>
    <button type="submit" id="go">Anmelden</button>
    <div class="err" id="err"></div>
    <div class="small">Code aus Ihrer Authenticator-App (6 Ziffern)</div>
  </form>
</div>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Wird geprüft …";
  try {
    const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "BaluMail" },
      body: JSON.stringify({ password: document.getElementById("pw").value, code: document.getElementById("code").value, keep: document.getElementById("keep").checked }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { location.replace("/"); return; }
    err.textContent = j.error || "Anmeldung fehlgeschlagen";
    document.getElementById("code").value = "";
  } catch { err.textContent = "Keine Verbindung zum Server"; }
  go.disabled = false; go.textContent = "Anmelden";
};
</script>
</body>
</html>
